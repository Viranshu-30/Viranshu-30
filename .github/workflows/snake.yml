name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_dots=#0d1322,#1b4d3a,#1e8a5f,#2dffa3,#b6ffdf&color_snake=#38d6ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#0d1322,#1b4d3a,#1e8a5f,#2dffa3,#b6ffdf&color_snake=#38d6ff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
