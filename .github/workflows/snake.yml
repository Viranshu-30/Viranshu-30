name: generate profile widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_dots=#0d1117,#1b4d3a,#1e8a5f,#2dffa3,#b6ffdf&color_snake=#38d6ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#0d1117,#1b4d3a,#1e8a5f,#2dffa3,#b6ffdf&color_snake=#38d6ff

      - name: build stats cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, json, urllib.request

          TOK = os.environ["GH_TOKEN"]; USER = os.environ["GH_USER"]

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + TOK,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": USER})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def gql(query):
              req = urllib.request.Request("https://api.github.com/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={"Authorization": "Bearer " + TOK,
                           "User-Agent": USER,
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          user = gh("https://api.github.com/users/" + USER)
          repos, page = [], 1
          while True:
              batch = gh("https://api.github.com/users/%s/repos?per_page=100&type=owner&page=%d" % (USER, page))
              repos += batch
              if len(batch) < 100: break
              page += 1
          own = [r for r in repos if not r.get("fork")]

          stars = sum(r.get("stargazers_count", 0) for r in own)
          followers = user.get("followers", 0)
          repo_count = user.get("public_repos", len(repos))

          contrib = 0
          try:
              q = '{ user(login: "%s") { contributionsCollection { contributionCalendar { totalContributions } } } }' % USER
              contrib = gql(q)["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]
          except Exception:
              pass

          langs = {}
          for r in own:
              try:
                  for k, v in gh(r["languages_url"]).items():
                      langs[k] = langs.get(k, 0) + v
              except Exception:
                  pass
          total = sum(langs.values()) or 1
          top = sorted(langs.items(), key=lambda kv: -kv[1])[:6]

          BG="#0d1117"; LINE="#1b2742"; TEXT="#e9f0ff"; MUTED="#8a9bbd"
          PAL=["#2dffa3","#38d6ff","#b18bff","#ffc24d","#ff6b9d","#8a9bbd"]
          MONO="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

          def shell(title):
              return ('<rect x="1" y="1" width="478" height="193" rx="12" fill="%s" stroke="%s" stroke-width="1.5"/>' % (BG, LINE)
                + '<rect x="1" y="1" width="478" height="193" rx="12" fill="none" stroke="#2dffa3" stroke-width="1.5" stroke-dasharray="140 1204" opacity=".9">'
                + '<animate attributeName="stroke-dashoffset" values="0;-1344" dur="9s" repeatCount="indefinite"/></rect>'
                + '<text x="24" y="34" font-family="%s" font-size="13" fill="#2dffa3" letter-spacing="1">%s</text>' % (MONO, title)
                + '<circle cx="452" cy="29" r="4" fill="#2dffa3"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>')

          rows = [("stars earned", format(stars, ",")),
                  ("contributions, past year", format(contrib, ",")),
                  ("followers", format(followers, ",")),
                  ("public repositories", format(repo_count, ","))]
          body = ""
          y = 68
          for label, val in rows:
              body += '<text x="24" y="%d" font-family="%s" font-size="13.5" fill="%s">%s</text>' % (y, MONO, MUTED, label)
              body += '<text x="456" y="%d" text-anchor="end" font-family="%s" font-size="16" font-weight="700" fill="%s">%s</text>' % (y, MONO, TEXT, val)
              y += 33
          svg = ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" role="img" aria-label="GitHub stats">'
                 + shell("$ github --stats") + body + "</svg>")
          open("dist/stats-card.svg", "w").write(svg)

          body = ""
          x = 24.0
          for i, (name, b) in enumerate(top):
              w = max(3.0, 432.0 * b / total)
              body += '<rect x="%.1f" y="58" width="%.1f" height="14" fill="%s"/>' % (x, w, PAL[i % 6])
              x += w
          body = ('<clipPath id="bar"><rect x="24" y="58" width="432" height="14" rx="7"/></clipPath>'
                  + '<rect x="24" y="58" width="432" height="14" rx="7" fill="%s"/>' % LINE
                  + '<g clip-path="url(#bar)">' + body + "</g>")
          for i, (name, b) in enumerate(top):
              cx = 24 + (i % 2) * 222
              cy = 102 + (i // 2) * 30
              pct = 100.0 * b / total
              body += '<circle cx="%d" cy="%d" r="5" fill="%s"/>' % (cx + 5, cy - 4, PAL[i % 6])
              body += '<text x="%d" y="%d" font-family="%s" font-size="12.5" fill="%s">%s</text>' % (cx + 18, cy, MONO, TEXT, name)
              body += '<text x="%d" y="%d" text-anchor="end" font-family="%s" font-size="12.5" fill="%s">%.1f%%</text>' % (cx + 200, cy, MONO, MUTED, pct)
          svg = ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" role="img" aria-label="Most used languages">'
                 + shell("$ languages --by-bytes") + body + "</svg>")
          open("dist/top-langs.svg", "w").write(svg)
          print("cards written:", stars, contrib, followers, repo_count, top[:3])
          PY

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
