<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 86" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="telemetry. live from the github api">
  <rect width="1000" height="86" fill="#05070d"/>
  <line x1="20" y1="43" x2="980" y2="43" stroke="#1b2742" stroke-width="1.5"/>
  <circle r="3" fill="#2dffa3">
    <animateMotion path="M20 43 H980" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="330" y="20" width="340" height="46" rx="23" fill="#0d1322" stroke="#1b2742" stroke-width="1.5"/>
  <text x="500" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" font-weight="700" fill="#e9f0ff" letter-spacing="2">telemetry</text>
  <text x="500" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8a9bbd" letter-spacing="1">live from the github api</text>
</svg>
