<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Channel 125 megahertz. Hardware-accelerated inference. An 8-bit quantized multilayer perceptron implemented in RTL on the Zybo Z10 FPGA.">
  <defs>
    <pattern id="gch125" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2742" stroke-width=".6" opacity=".45"/>
    </pattern>
    <clipPath id="clipch125"><rect x="20" y="20" width="960" height="208" rx="14"/></clipPath>
  </defs>
  <rect x="20" y="20" width="960" height="208" rx="14" fill="#0d1117" stroke="#1b2742" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="208" rx="14" fill="none" stroke="#38d6ff" stroke-width="1.6"
        stroke-dasharray="230 2106" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="0;-2336" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#clipch125)">
    <rect x="600" y="20" width="380" height="208" fill="#0d1117"/>
    <rect x="600" y="20" width="380" height="208" fill="url(#gch125)"/>
    <line x1="600" y1="20" x2="600" y2="228" stroke="#1b2742" stroke-width="1.5"/>
    
    <path id="tr0" d="M612 64 H700 L716 54 H744" fill="none" stroke="#1b2742" stroke-width="1.6"/>
    <rect width="7" height="7" fill="#2dffa3" x="-3.5" y="-3.5"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite"><mpath xlink:href="#tr0"/></animateMotion></rect>
    <path id="tr1" d="M612 100 H700 L716 110 H744" fill="none" stroke="#1b2742" stroke-width="1.6"/>
    <rect width="7" height="7" fill="#2dffa3" x="-3.5" y="-3.5"><animateMotion dur="1.8s" begin="0.45s" repeatCount="indefinite"><mpath xlink:href="#tr1"/></animateMotion></rect>
    <path id="tr2" d="M612 136 H700 L716 126 H744" fill="none" stroke="#1b2742" stroke-width="1.6"/>
    <rect width="7" height="7" fill="#2dffa3" x="-3.5" y="-3.5"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#tr2"/></animateMotion></rect>
    <path id="tr3" d="M612 172 H700 L716 182 H744" fill="none" stroke="#1b2742" stroke-width="1.6"/>
    <rect width="7" height="7" fill="#2dffa3" x="-3.5" y="-3.5"><animateMotion dur="1.8s" begin="1.35s" repeatCount="indefinite"><mpath xlink:href="#tr3"/></animateMotion></rect>
    <!-- chip -->
    <rect x="744" y="52" width="132" height="140" rx="10" fill="#0d1117" stroke="#38d6ff" stroke-width="1.6"/>
    <rect x="737" y="61" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="737" y="97" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="737" y="133" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="737" y="169" width="7" height="6" rx="1.5" fill="#8a9bbd"/>
    <rect x="876" y="67" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="876" y="93" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="876" y="119" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="876" y="145" width="7" height="6" rx="1.5" fill="#8a9bbd"/><rect x="876" y="171" width="7" height="6" rx="1.5" fill="#8a9bbd"/>
    <text x="810" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38d6ff" letter-spacing="1.5">ZYBO Z10</text>
    <rect x="758" y="90" width="48" height="30" rx="5" fill="#0d1117" stroke="#1b2742"/>
    <text x="782" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#e9f0ff">BRAM</text>
    <rect x="814" y="90" width="48" height="30" rx="5" fill="#0d1117" stroke="#1b2742"/>
    <text x="838" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#e9f0ff">MAC</text>
    <rect x="758" y="128" width="104" height="30" rx="5" fill="#0d1117" stroke="#1b2742"/>
    <text x="810" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#e9f0ff">784→128→64→10</text>
    <circle cx="768" cy="176" r="4" fill="#ff6b9d">
      <animate attributeName="opacity" values="1;.2;1" dur=".9s" repeatCount="indefinite"/>
    </circle>
    <text x="780" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a9bbd">clk 125MHz</text>
    <!-- leds -->
    <circle cx="906" cy="70" r="5" fill="#2dffa3"><animate attributeName="opacity" values=".12;.12;.12;.12;.12;.12;.12;.12;1;1;1;1;1;1;1;1;.12" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="96" r="5" fill="#2dffa3"><animate attributeName="opacity" values=".12;.12;.12;.12;1;1;1;1;.12;.12;.12;.12;1;1;1;1;.12" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="122" r="5" fill="#2dffa3"><animate attributeName="opacity" values=".12;.12;1;1;.12;.12;1;1;.12;.12;1;1;.12;.12;1;1;.12" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="148" r="5" fill="#2dffa3"><animate attributeName="opacity" values=".12;1;.12;1;.12;1;.12;1;.12;1;.12;1;.12;1;.12;1;.12" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;0.4375;0.5000;0.5625;0.6250;0.6875;0.7500;0.8125;0.8750;0.9375;1.0000" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
    <text x="906" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a9bbd">leds</text>
    <text x="612" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8a9bbd">uart in →</text>
    <text x="796" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8a9bbd">inference with no software stack</text>

  </g>

  <rect x="56" y="44" width="110" height="26" rx="6" fill="#0d1117" stroke="#38d6ff" stroke-opacity=".6"/>
  <circle cx="72" cy="57" r="3.4" fill="#38d6ff">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38d6ff" letter-spacing="1">CH 125MHz</text>

  <text x="56" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#e9f0ff">Hardware-accelerated inference</text>
  <text x="56" y="137" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8a9bbd">An 8-bit quantized multilayer perceptron implemented in RTL.</text>
  <text x="56" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8a9bbd">Pipelined MACs, dual-port BRAM, two asynchronous clock domains.</text>
  <rect x="56" y="178" width="53" height="26" rx="13" fill="#0d1117" stroke="#1b2742"/><text x="82" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">vhdl</text>
  <rect x="118.8" y="178" width="67" height="26" rx="13" fill="#0d1117" stroke="#1b2742"/><text x="152" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">vivado</text>
  <rect x="196.0" y="178" width="96" height="26" rx="13" fill="#0d1117" stroke="#1b2742"/><text x="244" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">tensorflow</text>
  <rect x="302.0" y="178" width="146" height="26" rx="13" fill="#0d1117" stroke="#1b2742"/><text x="375" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">8-bit fixed point</text>
