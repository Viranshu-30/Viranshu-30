<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img"
     aria-label="Channel SEC. PhishGuard. Gradient-boosted phishing detection at 97.2 percent accuracy and a 1.4 percent false negative rate, deployed as a Django application.">
  <defs><clipPath id="clipsec"><rect x="20" y="20" width="960" height="120" rx="14"/></clipPath></defs>
  <rect x="20" y="20" width="960" height="120" rx="14" fill="#0d1117" stroke="#1b2742" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="120" rx="14" fill="none" stroke="#ff6b9d" stroke-width="1.6"
        stroke-dasharray="180 1980" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="0;-2160" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="38" width="94" height="24" rx="6" fill="#0d1117" stroke="#ff6b9d" stroke-opacity=".6"/>
  <circle cx="71" cy="50" r="3.2" fill="#ff6b9d">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#ff6b9d" letter-spacing="1">CH SEC</text>
  <text x="56" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#e9f0ff">PhishGuard</text>
  <text x="56" y="117" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a9bbd">Gradient-boosted phishing detection at 97.2% accuracy, 1.4% FNR.</text>

  <g clip-path="url(#clipsec)">
    <rect x="560" y="20" width="420" height="120" fill="#0d1117"/>
    <line x1="560" y1="20" x2="560" y2="140" stroke="#1b2742" stroke-width="1.5"/>
    <!-- url bar -->
    <rect x="584" y="48" width="252" height="30" rx="15" fill="#0d1117" stroke="#1b2742"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">
      <text x="600" y="67" fill="#e9f0ff" opacity="1">
        <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;.5;.99;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
        http://paypa1-login.xyz
      </text>
      <text x="600" y="67" fill="#e9f0ff" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.5;.99;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
        https://github.com
      </text>
    </g>
    <!-- scan beam -->
    <rect x="584" y="48" width="9" height="30" fill="#ff6b9d" opacity=".5">
      <animate attributeName="x" values="584;827;584;827" keyTimes="0;.28;.5;.78" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff6b9d;#ff6b9d;#2dffa3;#2dffa3" keyTimes="0;.49;.5;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.5;0;.5;.5;0" keyTimes="0;.28;.29;.5;.78;.79" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- verdicts -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.3;.5;1" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
      <rect x="852" y="49" width="104" height="28" rx="14" fill="#ff6b9d"/>
      <text x="904" y="67" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2d0b16">phishing ✗</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.8;.81;.99" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
      <rect x="852" y="49" width="104" height="28" rx="14" fill="#2dffa3"/>
      <text x="904" y="67" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#06281a">legit ✓</text>
    </g>
    <text x="584" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8a9bbd">30 features · 11k urls · catboost vs rf, lgbm, svm, dt</text>
  </g>
</svg>
