<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Channel memory version 2. HippoSync. A provider-agnostic chat platform whose memory layer persists across sessions and providers.">
  <defs>
    <pattern id="gchmem" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2742" stroke-width=".6" opacity=".45"/>
    </pattern>
    <clipPath id="clipchmem"><rect x="20" y="20" width="960" height="208" rx="14"/></clipPath>
  </defs>
  <rect width="1000" height="248" fill="#05070d"/>
  <rect x="20" y="20" width="960" height="208" rx="14" fill="#0a0f1b" stroke="#1b2742" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="208" rx="14" fill="none" stroke="#38d6ff" stroke-width="1.6"
        stroke-dasharray="230 2106" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="0;-2336" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#clipchmem)">
    <rect x="600" y="20" width="380" height="208" fill="#0d1322"/>
    <rect x="600" y="20" width="380" height="208" fill="url(#gchmem)"/>
    <line x1="600" y1="20" x2="600" y2="228" stroke="#1b2742" stroke-width="1.5"/>
    
    <!-- memory spine -->
    <line x1="790" y1="40" x2="790" y2="200" stroke="#1b2742" stroke-width="1.5" stroke-dasharray="3 5"/>
    <rect x="766" y="104" width="48" height="34" rx="8" fill="#111a2e" stroke="#38d6ff"/>
    <text x="790" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#38d6ff">mem</text>
    <circle r="3.6" fill="#38d6ff" opacity="0">
      <animateMotion path="M790 64 V100" dur="6.0s" repeatCount="indefinite"
        keyPoints="0;0;1;1" keyTimes="0;.30;.48;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.30;.31;.47;.48;1"
        calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.6" fill="#2dffa3" opacity="0">
      <animateMotion path="M790 142 V176" dur="6.0s" repeatCount="indefinite"
        keyPoints="0;0;1;1" keyTimes="0;.62;.80;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.62;.63;.79;.80;1"
        calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
    </circle>
    <!-- session A -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.05;1" calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
      <rect x="628" y="40" width="150" height="30" rx="10" fill="#111a2e" stroke="#1b2742"/>
      <text x="642" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e9f0ff">session a: gpt</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.22;1" calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
      <rect x="652" y="76" width="112" height="24" rx="9" fill="#38d6ff" opacity=".9"/>
      <text x="708" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#07222c">ctx saved ✓</text>
    </g>
    <!-- session B -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.55;1" calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
      <rect x="802" y="150" width="166" height="30" rx="10" fill="#111a2e" stroke="#1b2742"/>
      <text x="816" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e9f0ff">session b: claude</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.86;1" calcMode="discrete" dur="6.0s" repeatCount="indefinite"/>
      <rect x="836" y="186" width="132" height="24" rx="9" fill="#2dffa3" opacity=".9"/>
      <text x="902" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#06281a">it remembers ✓</text>
    </g>
    <text x="628" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8a9bbd">gpt · claude · gemini, one memory</text>

  </g>

  <rect x="56" y="44" width="110" height="26" rx="6" fill="#111a2e" stroke="#38d6ff" stroke-opacity=".6"/>
  <circle cx="72" cy="57" r="3.4" fill="#38d6ff">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38d6ff" letter-spacing="1">CH MEM.V2</text>

  <text x="56" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#e9f0ff">HippoSync</text>
  <text x="56" y="137" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8a9bbd">A provider-agnostic chat platform with a persistent memory layer.</text>
  <text x="56" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8a9bbd">Context established under GPT is retrievable under Claude or Gemini.</text>
  <rect x="56" y="178" width="67" height="26" rx="13" fill="#0d1322" stroke="#1b2742"/><text x="90" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">python</text>
  <rect x="133.2" y="178" width="118" height="26" rx="13" fill="#0d1322" stroke="#1b2742"/><text x="192" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">memmachine v2</text>
  <rect x="260.8" y="178" width="125" height="26" rx="13" fill="#0d1322" stroke="#1b2742"/><text x="323" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">multi-provider</text>
  <rect x="395.6" y="178" width="67" height="26" rx="13" fill="#0d1322" stroke="#1b2742"/><text x="429" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">tavily</text>
  <rect x="472.8" y="178" width="96" height="26" rx="13" fill="#0d1322" stroke="#1b2742"/><text x="521" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8a9bbd">email auth</text>
</svg>
